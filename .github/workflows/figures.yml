name: figures

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The canvas-fit guard in context_answer/plotting/style.py is calibrated to
      # Inter's text metrics and raises when content overflows the canvas. Without
      # the font three generators fail and five paper figures are not written.
      - run: sudo apt-get update && sudo apt-get install -y fonts-inter
      - run: pip install -e ".[dev]"
      - run: python -m figures.make_all --out out
      - run: python pipeline/verify_records.py
      - run: pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: figures
          path: out/*.pdf
