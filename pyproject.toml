[project]
name = "context-answer"
version = "0.1.0"
description = "Code and result records for 'Affine Anticipation: LLM Answer Representations Are Largely Linearly Predictable from Context'"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
pipeline = ["torch>=2.2", "huggingface_hub>=0.23", "anthropic>=0.30", "openai>=1.30"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["context_answer*", "figures*"]

[tool.ruff]
line-length = 100
target-version = "py311"
