[project]
name = "context-answer"
version = "0.1.0"
description = "Code and result records for 'Affine Anticipation: LLM Answer Representations Are Largely Linearly Predictable from Context'"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8,<3.11",  # 3.11 changes text metrics; a layout assertion in one figure trips
]

[project.optional-dependencies]
pipeline = [
  "torch>=2.2",
  "huggingface_hub>=0.23",
  "anthropic>=0.30",
  "openai>=1.30",
  "python-dotenv>=1.0",  # context_answer/orchestrate/env.py imports it at module level
]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# figures/ holds scripts run from the repository root. They are left out of the
# installed distribution, and the root conftest.py puts them on sys.path for pytest.
include = ["context_answer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
